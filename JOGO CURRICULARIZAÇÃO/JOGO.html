<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXERCITANDO A MENTE</title>

    <link rel="stylesheet" href="JOGO.css">
</head>
<body>
    <div id="TRANSICAO"></div>

    


    <div id="JOGO">
        <div class="JOGO-FUNDO">
            <div id="JOGO-BLUR"></div>


            
            <div class="JOGO-PAINEL-PERGUNTAS">
                <b id="JOGO-LOCAL-DIFICULDADE">
                    <h2>DIFICULDADE</h2>
                </b>

                <b id="JOGO-LOCAL-TEMA">
                    <h2>TEMA</h2>
                </b>

                <b id="JOGO-LOCAL-PERGUNTAS">
                    <h3>A pergunta vai aparecer aqui.</h3>
                </b>

                <div class="JOGO-LOCAL-IMAGEM">
                    <div id="JOGO-IMAGEM-OU-DESAFIO"></div>
                </div>
            </div>

            

            <div class="JOGO-PAINEL-RESPOSTAS">
                <div class="JOGO-TITULO-PAINEL-RESPOSTAS">
                        <b>RESPOSTAS</b>
                </div>


                <button class="LOCAL-RESPOSTA-A">
                    <div id="RESPOSTA-A"></div></button>


                <button class="LOCAL-RESPOSTA-B">
                    <div id="RESPOSTA-B"></div></button>


                <button class="LOCAL-RESPOSTA-C">
                    <div id="RESPOSTA-C"></div></button>


                <button class="LOCAL-RESPOSTA-D">
                    <div id="RESPOSTA-D"></div></button>
            </div>

            

            <div class="JOGO-PAINEL-BOTOES-FUNCAO">
                <button id="JOGO-BOTAO-PARAR"></button>
                <button id="JOGO-BOTAO-CONTINUAR"></button>
            </div>



            <div id="JOGO-RESULTADO">
                <h1>RESULTADO</h1>

                <h2 id="JOGO-RESULTADOS-CERTOS">CERTAS: 0</h2>
                <h2 id="JOGO-RESULTADOS-ERRADOS">ERRADAS: 0</h2>

                <div id="JOGO-RESULTADO-ESTRELAS"></div>
            </div>
        </div>
    </div>


























    <script src="JOGO.js"></script>
</body>
</html>
